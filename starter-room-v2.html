<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canadian Life Simulator — Starter Bedroom</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#101b2b;color:#f3f7ff}
#app{height:100dvh;min-height:360px;position:relative;overflow:hidden}
.top{position:absolute;top:12px;left:12px;right:12px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.top strong{font-size:clamp(12px,1.4vw,18px);letter-spacing:.02em;padding:12px 16px;border-radius:12px;background:rgba(17,27,43,.9);box-shadow:0 6px 20px #0004}
.top span{font-size:12px;color:#b9cbe2}
.top button{pointer-events:auto;border:1px solid #8191ab;background:#385ddd;color:white;font-weight:750;padding:12px 18px;cursor:pointer;border-radius:11px;box-shadow:0 8px 25px #0005}
.workspace{height:100%;position:relative}
#scene{position:absolute;inset:0;background:linear-gradient(#a8c3df,#dbe5eb)}
#scene canvas{display:block;width:100%;height:100%}
.hint{position:absolute;bottom:14px;left:14px;z-index:2;padding:9px 12px;background:#152236dd;border-radius:10px;font-size:12px;pointer-events:none;max-width:calc(100% - 30px)}
.panel{position:absolute;z-index:8;right:14px;top:75px;bottom:15px;width:min(300px,calc(100% - 28px));overflow:auto;border:1px solid #667990;border-radius:16px;padding:18px;background:#1d2c43f5;box-shadow:0 20px 46px #0007;scrollbar-width:thin}
.panel.hidden{display:none}
.panel h2{font-size:19px;margin:0 0 14px}
.panel label{display:block;margin:12px 0 6px;font-size:13px;color:#d4e5f7}
.panel select,.panel button{display:block;width:100%;min-height:43px;padding:11px;border-radius:9px;border:1px solid #667990;font-size:14px}
.panel select{color:#142135;background:#f6f8ff}
.panel button{cursor:pointer;background:#486be1;color:white;font-weight:700;border:0;margin-top:12px}
.panel button.secondary{background:#31435d}
.status{font-size:12px;line-height:1.5;color:#d6e4f5;padding-top:12px;min-height:42px}
@media(max-width:650px){.top{top:8px;left:8px;right:8px}.top strong{font-size:11px;padding:10px}.top strong span{display:none}.top button{padding:10px 12px}.panel{top:60px;bottom:12px;right:8px;width:min(290px,calc(100% - 16px));padding:12px}.hint{bottom:6px;left:6px;font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body><div id="app"><header class="top"><strong>CANADIAN LIFE SIMULATOR <span> / MY FIRST ROOM</span></strong><button type="button" id="toggleMenu" aria-controls="decorPanel" aria-expanded="true">☰ Decorate Room</button></header><main class="workspace"><div id="scene"><div class="hint">Drag to rotate • Scroll to zoom • Choose furniture and click Add furniture</div></div><aside class="panel" id="decorPanel"><h2>Design your room 🏠</h2><label for="wall">Wall colour</label><select id="wall"><option value="cream">Warm cream</option><option value="blue">Soft blue</option><option value="pink">Blush pink</option><option value="sage">Sage green</option></select><label for="floor">Flooring</label><select id="floor"><option value="wood">Light wood</option><option value="dark">Dark wood</option><option value="grey">Grey floor</option></select><label for="furniture">Place furniture</label><select id="furniture"><option value="bed">Bed</option><option value="desk">Desk</option><option value="rug">Rug</option><option value="lamp">Floor lamp</option></select><button id="add">Add furniture</button><button id="remove" class="secondary">Remove last item</button><button id="reset" class="secondary">Reset room</button><div class="status" id="status">Choose an item and click Add furniture. It appears in your room instantly. Your design saves in this browser.</div></aside></main></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const view=document.getElementById('scene'), msg=document.getElementById('status');
const panel=document.getElementById('decorPanel'),toggle=document.getElementById('toggleMenu');
toggle.addEventListener('click',()=>{panel.classList.toggle('hidden');toggle.setAttribute('aria-expanded',String(!panel.classList.contains('hidden')));toggle.textContent=panel.classList.contains('hidden')?'☰ Open Decorating Menu':'✕ Close Decorating Menu';});
const scene=new THREE.Scene(); scene.background=new THREE.Color('#b7cada');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;view.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(44,1,.1,80);camera.position.set(7,6.5,8.2);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.15,0);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=18;controls.maxPolarAngle=Math.PI/2.02;controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x637485,2.1));const sun=new THREE.DirectionalLight(0xfff0db,2.4);sun.position.set(2,8,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;scene.add(sun);
const colors={cream:0xf3e7d5,blue:0xcadcec,pink:0xf1cfda,sage:0xcddfce},floors={wood:0xc3956e,dark:0x756052,grey:0xa8adb4};
function material(color,roughness=.85){return new THREE.MeshStandardMaterial({color,roughness,side:THREE.DoubleSide})}
function box(parent,w,h,d,color,x,y,z){let mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
const floor=box(scene,7,.18,7,floors.wood,0,-.09,0);const back=box(scene,7,3.7,.15,colors.cream,0,1.85,-3.5);const left=box(scene,.15,3.7,7,colors.cream,-3.5,1.85,0);
// Faux window with frame and skyline-coloured glass
box(scene,2.3,1.5,.04,0xd5ebf8,0,2.35,-3.405);box(scene,2.4,.07,.09,0xffffff,0,3.12,-3.36);box(scene,2.4,.07,.09,0xffffff,0,1.58,-3.36);box(scene,.08,1.58,.1,0xffffff,-1.2,2.35,-3.36);box(scene,.08,1.58,.1,0xffffff,1.2,2.35,-3.36);box(scene,.07,1.52,.11,0xffffff,0,2.35,-3.34);
const furniture=[];function make(kind,x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);if(kind==='bed'){box(g,2,.33,2.6,0x9b7051,0,.37,0);box(g,1.87,.2,2.36,0xf7f5ef,0,.61,.03);box(g,1.9,.12,1.5,0x7790b4,0,.78,.42);box(g,.75,.14,.48,0xffffff,-.48,.79,-.81);box(g,.75,.14,.48,0xffffff,.48,.79,-.81)}else if(kind==='desk'){box(g,1.7,.13,.7,0x8c5c41,0,1.05,0);for(let x1 of [-.68,.68])for(let z1 of [-.23,.23])box(g,.09,.99,.09,0x4e4a4c,x1,.52,z1)}else if(kind==='rug'){box(g,2,.025,1.5,0xd3a7a0,0,.02,0)}else if(kind==='lamp'){box(g,.24,.12,.24,0x403f48,0,.07,0);box(g,.07,1.55,.07,0x55515a,0,.84,0);const shade=new THREE.Mesh(new THREE.CylinderGeometry(.23,.4,.5,20),material(0xffe0a8));shade.position.y=1.78;g.add(shade)}furniture.push({kind,x,z,g});save()}
function save(){try{localStorage.setItem('canadian-life-room-v1',JSON.stringify({wall:document.getElementById('wall').value,floor:document.getElementById('floor').value,items:furniture.map(({kind,x,z})=>({kind,x,z}))}))}catch(e){msg.textContent='Room works, but this browser may not save changes.'}}
function sync(){back.material.color.setHex(colors[document.getElementById('wall').value]);left.material.color.setHex(colors[document.getElementById('wall').value]);floor.material.color.setHex(floors[document.getElementById('floor').value]);save()}
document.getElementById('wall').addEventListener('change',sync);document.getElementById('floor').addEventListener('change',sync);
// Place items instantly so players do not need a precise floor click.
// Spread items over a visible grid within the room boundaries.
const placementSlots=[[-1.55,-1.35],[1.4,-1.35],[-1.5,1.25],[1.4,1.25],[0,0],[-2.25,0],[2.2,0],[0,-2.15],[0,2.15]];
document.getElementById('add').onclick=()=>{
  const kind=document.getElementById('furniture').value;
  const [x,z]=placementSlots[furniture.length%placementSlots.length];
  make(kind,x,z);
  msg.textContent=`Added ${kind}! Drag to rotate the room, or choose another item.`;
};
document.getElementById('remove').onclick=()=>{const it=furniture.pop();if(it){scene.remove(it.g);save();msg.textContent='Last item removed.'}};
document.getElementById('reset').onclick=()=>{for(const it of furniture)scene.remove(it.g);furniture.length=0;document.getElementById('wall').value='cream';document.getElementById('floor').value='wood';sync();msg.textContent='Room reset.'};
try{const saved=JSON.parse(localStorage.getItem('canadian-life-room-v1')||'null');if(saved){if(colors[saved.wall])document.getElementById('wall').value=saved.wall;if(floors[saved.floor])document.getElementById('floor').value=saved.floor;for(const it of (saved.items||[]).slice(0,100)){if(['bed','desk','rug','lamp'].includes(it.kind)&&Number.isFinite(it.x)&&Number.isFinite(it.z))make(it.kind,it.x,it.z)}sync()}}catch(e){}
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(view);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
